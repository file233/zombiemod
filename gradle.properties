# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.235
loader_version_range=[1,)

# Mod metadata
mod_id=zombietide
mod_name=ZombieTide
mod_license=GPL-3.0-or-later
mod_version=1.1.0
mod_group_id=dev.file233.zombietide
mod_authors=file233, Arena Agent Mode
mod_description=Relentless zombie apocalypse: escalating 50-wave sieges, sound-sensitive horde AI, block-breaking ghouls and a tiny tactical HUD.
