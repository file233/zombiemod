# ZombieTide — NeoForge 1.21.1 mod
# Gradle daemon settings (CI-friendly, enough for Minecraft workspace)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (better parameter names/javadoc in dev). CI can build without them being strictly cached.
parchment_minecraft_version=1.21.1
