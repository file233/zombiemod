modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/file233/zombiemod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "Built with NeoForge ${neo_version} for Minecraft ${minecraft_version}"
description = '''${mod_description}'''
logoFile = "logo.png"
displayURL = "https://github.com/file233/zombiemod"
displayTest = "MATCH_VERSION"

[modproperties.${mod_id}]
"neoforge:modsIcon" = "logo.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

